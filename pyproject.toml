[project]
name = "blogging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dynaconf>=3.3.5",
    "fastapi>=0.143.0",
    "gitpython>=3.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "pydantic>=2.14.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
exclude = ["docker", ".venv"]
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["blogging", "tests"]

[project.scripts]
server = "blogging:main"
init = "blogging.init:main"

